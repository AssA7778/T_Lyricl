# ══════════════════════════════════════════════════════════════════
#  tglyrics — لیریک زنده و سینک‌شده توی بیوی تلگرام
#  این فایل رو به config.toml کپی کن و پرش کن.
# ══════════════════════════════════════════════════════════════════

[telegram]
# از my.telegram.org بگیر
api_id  = 0
api_hash = ""

# با `python login.py` بساز و اینجا بذار.
# ⚠️ این رشته کلید کامل اکانتته. با هیچ‌کس شریکش نکن.
session = ""

# سقف طول بیو. 0 یعنی خودکار از خود تلگرام بپرس
# (۷۰ برای اکانت معمولی، ۱۴۰ برای پریمیوم)
bio_limit = 0

# وقتی هیچی پخش نمی‌شه چی توی بیو باشه.
# خالی بذاری = بیوی اصلی خودت برمی‌گرده (موقع اجرا ذخیره می‌شه)
idle_bio = ""

# کنترل زنده از داخل تلگرام. "me" یعنی Saved Messages.
# خالی بذار تا غیرفعال بشه.
control_chat = "me"
control_prefix = "."


[rate]
# ─── محافظ FLOOD_WAIT ───
# حداقل فاصله‌ی بین دو بار نوشتن بیو (ثانیه).
# ۳.۵ نقطه‌ی شروع محافظه‌کارانه‌ایه. برنامه خودش تنظیمش می‌کنه.
min_interval = 3.5

# اگه تلگرام گیر داد، فاصله ضرب در این عدد می‌شه (تا سقف).
backoff_factor = 1.6
max_interval_cap = 60.0

# بعد از این تعداد نوشتنِ بی‌مشکل، فاصله کم‌کم برمی‌گرده پایین.
recover_after = 25
recover_factor = 0.92

# سقف سخت: بیشتر از این تعداد در یک دقیقه نمی‌نویسه.
max_writes_per_minute = 18

# کف مطلق — هیچ‌وقت سریع‌تر از این نمی‌نویسه حتی اگه یادگیری بگه می‌شه.
hard_floor = 2.5

# فاصله‌ی یادگرفته‌شده اینجا ذخیره می‌شه تا بعد ری‌استارت از صفر شروع نکنه.
state_file = "data/rate_state.json"


[lyrics]
user_agent = "tglyrics/1.0 (+https://github.com/AssA7778/T_Lyricl)"
cache_db = "data/cache.db"

# فایل‌های .lrc دستی خودت. اسم فایل: "Artist - Title.lrc"
# هرچی اینجا باشه بر LRCLIB اولویت داره — برای آهنگ‌های فارسیِ کمیاب عالیه.
local_dir = "lyrics"

# اگه کل لیریک‌ها یه‌کم جلو/عقبن، اینجا میلی‌ثانیه بده.
# مثبت = زودتر نشون بده، منفی = دیرتر.
global_offset_ms = 0

# بین بندها (وقتی خواننده نمی‌خونه) چی نشون بده.
interlude = "♪"
show_interlude = true

# خط بلندتر از سقف بیو چی بشه؟
#   "chunk"    = سینک‌شده تیکه‌تیکه اسکرول می‌شه  ← پیشنهادی برای اکانت معمولی
#   "truncate" = فقط بریده می‌شه با …
long_line_mode = "chunk"

# هر تیکه حداقل این‌قدر دیده بشه (میلی‌ثانیه) تا تعداد نوشتن منفجر نشه.
min_chunk_ms = 1300

# چیزی که قبل از متن بیاد. مثلاً "♪ " — ولی از سقف ۷۰ کاراکترت کم می‌کنه.
prefix = ""

# اگه هیچ لیریکی پیدا نشد، اسم آهنگ رو نشون بده؟
fallback_to_track = true
fallback_format = "♪ {artist} – {title}"


[source]
# منبع موقعیت پخش:
#   "webhook" = یوزراسکریپت مرورگر / ایجنت اندروید  ← پیشنهادی
#   "mpris"   = پلیر روی همین لینوکس (دسکتاپ)
#   "spotify" = Spotify Web API (نیاز به اپِ صاحب‌پریمیوم — از فوریه ۲۰۲۶)
kind = "webhook"

# اگه این‌قدر ثانیه از دستگاه خبری نشد، فرض کن قطع شده.
stale_after = 45


[source.webhook]
host = "0.0.0.0"
port = 8787
# ⚠️ حتماً عوضش کن. همین رو توی یوزراسکریپت هم می‌ذاری.
token = "CHANGE_ME_TO_SOMETHING_LONG"


[source.spotify]
client_id = ""
client_secret = ""
refresh_token = ""
poll_interval = 3.0


[source.mpris]
# خالی = اولین پلیرِ در حال پخش. یا مثلاً "spotify" / "vlc"
player = ""


[log]
level = "INFO"
file = "data/tglyrics.log"
