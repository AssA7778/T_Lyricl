[telegram]
api_id = 0
api_hash = ""
session = ""
bio_limit = 0
idle_bio = ""
control_chat = "me"
control_prefix = "."

[rate]
min_interval = 3.5
backoff_factor = 1.6
max_interval_cap = 60.0
recover_after = 25
recover_factor = 0.92
max_writes_per_minute = 18
hard_floor = 2.5
state_file = "data/rate_state.json"

[lyrics]
user_agent = "tglyrics/1.0 (+https://github.com/AssA7778/T_Lyricl)"
cache_db = "data/cache.db"
local_dir = "lyrics"
global_offset_ms = 0
interlude = "♪"
show_interlude = true
long_line_mode = "chunk"
min_chunk_ms = 1300
prefix = ""
fallback_to_track = true
fallback_format = "♪ {artist} – {title}"

[source]
kind = "webhook"
stale_after = 45

[source.webhook]
host = "0.0.0.0"
port = 8787
token = "CHANGE_ME_TO_SOMETHING_LONG"

[source.spotify]
client_id = ""
client_secret = ""
refresh_token = ""
poll_interval = 3.0

[source.mpris]
player = ""

[log]
level = "INFO"
file = "data/tglyrics.log"
